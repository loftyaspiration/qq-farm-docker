services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    image: qq-farm-bot:fnos-fork
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      # 数据、账号、日志都在这里；升级镜像不会丢
      - ./data:/app/core/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
